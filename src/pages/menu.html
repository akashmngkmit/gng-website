<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Manager | Groove & Grub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/footer.css">
</head>

<body>
    <header class="header">
        <img src="../assets/images/gng-logo.png" alt="gng-logo" class="logo">
        <!-- desktop navbar -->
        <nav class="navbar">
            <a href="../index.html">Home</a>
            <a href="./pages/menu.html">Menu</a>
        </nav>
        <!-- mobile navbar -->
        <button class="hamburger-menu" id="hamburger-menu" aria-label="Toggle navigation" aria-expanded="false">
            <img src="../assets/icons/hamburger-icon.png" alt="" aria-hidden="true" loading="lazy">
        </button>
        <nav class="mobile-navbar" id="mobile-navbar" aria-hidden="true">
            <a href="../index.html">Home</a>
            <a href="./menu.html">Menu</a>
        </nav>
    </header>

    <main class="menu-manager-container">
        <h1>Menu Dashboard</h1>

        <section class="form-section">
            <h2>Add New Item</h2>
            <form id="menu-form">
                <div class="form-group">
                    <label for="foodName">Food Name</label>
                    <input type="text" id="foodName" placeholder="e.g. Smash Burger" required>
                </div>

                <div class="form-group">
                    <label for="foodPrice">Price ($)</label>
                    <input type="number" id="foodPrice" placeholder="12.99" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="foodCategory">Category</label>
                    <select id="foodCategory">
                        <option value="burger">Burgers</option>
                        <option value="starter">Starters</option>
                        <option value="desert">Deserts</option>
                        <option value="drink">Drinks</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="foodDesc">Description</label>
                    <textarea id="foodDesc" rows="3" placeholder="Juicy patty with..."></textarea>
                </div>

                <div class="form-group">
                    <label for="foodImage">Image URL</label>
                    <input type="url" id="foodImage" placeholder="https://unsplash.com/...">
                </div>

                <button type="submit" class="cta-btn">Add to Menu</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Current Menu</h2>
            <div id="menu-grid" class="menu-grid">
                <div class="menu-card">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=60"
                        alt="Mock Burger">
                    <div class="card-content">
                        <div class="card-header">
                            <h3>Mock Smash Burger</h3>
                            <span class="card-price">$12.99</span>
                        </div>
                        <p class="card-tag">burger</p>
                        <p class="card-desc">This is a static mock card to test the CSS styling. It will be replaced by
                            JavaScript later.</p>
                        <div class="action-buttons">
                            <button class="btn-edit">Edit</button>
                            <button class="btn-delete">Delete</button>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <h2 class="footer-title">Groove & Grub</h2>
    
        <div class="footer-credits">
            Created with <span class="heart-icon">&hearts;</span> by
            <a id="link-insta-personal" href="#" target="_blank" rel="noopener noreferrer">
                @akashmnandan
            </a>
        </div>
    
        <div class="social-links">
            <a id="link-insta-brand" href="#" target="_blank" aria-label="Instagram" class="icon-btn"
                rel="noopener noreferrer">
                <img id="icon-insta-brand" src="" alt="Instagram" class="social-icon">
            </a>
    
            <a id="link-twitter-brand" href="#" target="_blank" aria-label="X (Twitter)" class="icon-btn"
                rel="noopener noreferrer">
                <img id="icon-twitter-brand" src="" alt="X" class="social-icon">
            </a>
        </div>
    </footer>


    <!-- Empty JS file for now -->
    <script src="../js/main.js"></script>
    <script src="../js/menu.js"></script>
    <script src="../js/constants.js"></script>
</body>

</html>
